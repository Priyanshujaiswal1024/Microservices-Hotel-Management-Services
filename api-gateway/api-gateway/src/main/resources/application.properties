server.port=8080
spring.application.name=API-GATEWAY

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
spring.cloud.gateway.mvc.routes[5].id=payment-service
spring.cloud.gateway.mvc.routes[5].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.mvc.routes[5].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.mvc.routes[0].id=user-service
spring.cloud.gateway.mvc.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.mvc.routes[4].id=auth-service
spring.cloud.gateway.mvc.routes[4].uri=lb://USER-SERVICE
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/auth/**
spring.cloud.gateway.mvc.routes[1].id=hotel-service
spring.cloud.gateway.mvc.routes[1].uri=lb://HOTEL-SERVICE
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/hotels/**

spring.cloud.gateway.mvc.routes[2].id=rating-service
spring.cloud.gateway.mvc.routes[2].uri=lb://RATING-SERVICE
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/ratings/**

spring.cloud.gateway.mvc.routes[3].id=booking-service
spring.cloud.gateway.mvc.routes[3].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/bookings/**
jwt.secretKey=your_secret_key_minimum_32_characters_long